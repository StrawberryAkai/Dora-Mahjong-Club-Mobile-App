name: dora_mahjong
description: Dora Helper for Dora Mahjong Club (UCSD 麻将社).
publish_to: none
# Requested 0.1.0.1 maps to version 0.1.0 and build 1.
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.17.2
  uuid: ^4.5.2

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/club_logo.png
